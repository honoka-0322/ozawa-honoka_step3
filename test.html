<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TNG CAFE</title>
    <link rel="stylesheet" href="./css/reset.css">
    <link rel="stylesheet" href="./css/test.css">
</head>
<body>
    <header class="header">
        <div class="header-inner inner">
            <h1 class="header-ttl">
                TNG CAFE
            </h1>
            <p class="header-txt">心安らぐ一杯をあなたに</p>
            <nav class="header-nav">
                <ul class="header-nav-list">
                    <li class="header-nav-item">
                        <a href="#AboutUs" class="header-nav-link">About Us</a>
                    </li>
                    <li class="header-nav-item">
                        <a href="#Menu" class="header-nav-link">Menu</a>
                    </li>
                    <li class="header-nav-item">
                        <a href="#Contact" class="header-nav-link">Contact</a>
                    </li>
                </ul>
            </nav>
        </div>
    </header>
    <main class="main">
        <section id="AboutUs" class="AboutUs">
            <div class="AboutUs-inner inner">
                <h2 class="AboutUs-ttl">About Us</h2>
                <p class="AboutUs-txt">TNG CAFEは自然の香りに包まれたリラックス空間を提供しています。<br>
                自家焙煎コーヒーと手作りスイーツで、穏やかな時間をお過ごしください。</p>
                <div class="AboutUs-img-wrap">
                    <img class="AboutUs-img" src="./img/cafe.jpg" alt="カフェの内観">
                </div>
            </div>
        </section>
        <section id="Menu" class="Menu">
            <div class="Menu-inner inner">
                <h2 class="Menu-ttl">Menu</h2>
                <div class="Menu-item-contents">
                    <div class="Menu-item-wrap">
                        <img src="./img/coffe.jpg" alt="コーヒーの画像">
                        <p class="Menu-item-img-txt">ブレンドコーヒー</p>
                    </div>
                    <div class="Menu-item-wrap">
                        <img src="./img/cake.jpg" alt="スイーツの画像">
                        <p class="Menu-item-img-txt">ベイクドチーズケーキ</p>
                    </div>
                    <div class="Menu-item-wrap">
                        <img src="./img/cafelatte.jpg" alt="カフェラテの画像">
                        <p class="Menu-item-img-txt">カフェラテ</p>
                    </div>
                </div>
            </div>
        </section>
        <section id="Contact" class="Contact">
            <div class="Contact-inner inner">
                <h2 class="Contact-ttl">Contact</h2>
                <form action="#" class="Contact-form">
                    <label for="name">お名前：<br></label>
                    <input type="text" class="Contact-name"><br><br>
                    <label for="mail">メールアドレス：<br></label>
                    <input type="mail" class="Contact-mail"><br><br>
                    <label for="message">お問い合わせ内容：<br></label>
                    <textarea name="message" id="message" class="Contact-message"></textarea><br><br>
                    <input type="submit" value="送信" class="Contact-btn">
                </form>
            </div>
        </section>
    </main>
    <footer class="footer">
        <div class="footer-inner inner">
            <p class="copyright"><small>@2026 TNG CAFE</small></p>
        </div>
    </footer>
</body>
</html>
